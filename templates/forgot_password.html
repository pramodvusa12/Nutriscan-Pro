<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - NutriScan Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
--bg:#0a0f0d;
--surface:#111a14;
--card:#16231a;
--border:#1f3328;
--accent:#3dffa0;
--accent2:#7fffcb;
--warn:#ff6b4a;
--text:#e8f5ee;
--text-dim:#7a9e8a;
--font-head:'Clash Display',sans-serif;
--font-body:'DM Sans',sans-serif;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:var(--bg);
font-family:var(--font-body);
color:var(--text);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.auth-wrap{
width:400px;
background:var(--card);
padding:35px;
border-radius:15px;
border:1px solid var(--border);
box-shadow:0 20px 60px rgba(0,0,0,.4);
}

.logo{
font-family:var(--font-head);
font-size:28px;
font-weight:700;
margin-bottom:10px;
}

.logo span{
color:var(--accent);
}

h2{
margin-bottom:10px;
}

p{
color:var(--text-dim);
margin-bottom:25px;
}

label{
display:block;
margin-bottom:8px;
font-size:14px;
}

input{
width:100%;
padding:12px;
background:var(--surface);
border:1px solid var(--border);
border-radius:8px;
color:white;
margin-bottom:20px;
}

input:focus{
outline:none;
border-color:var(--accent);
}

button{
width:100%;
padding:12px;
background:var(--accent);
border:none;
border-radius:8px;
font-size:16px;
font-weight:600;
cursor:pointer;
}

button:hover{
background:var(--accent2);
}

.back{
text-align:center;
margin-top:20px;
}

.back a{
color:var(--accent);
text-decoration:none;
}
</style>
</head>

<body>

<div class="auth-wrap">

<div class="logo">Nutri<span>Scan</span> Pro</div>

<h2>Forgot Password</h2>

<p>Enter your registered email address.</p>

{% with messages = get_flashed_messages(with_categories=true) %}
{% for category,msg in messages %}
<p style="color:#3dffa0;">{{ msg }}</p>
{% endfor %}
{% endwith %}

<form method="POST">

<label>Email Address</label>

<input
type="email"
name="email"
placeholder="Enter your registered email"
required>

<button type="submit">
Send Reset Link
</button>

</form>

<div class="back">
<a href="{{ url_for('login') }}">← Back to Login</a>
</div>

</div>

</body>
</html>
